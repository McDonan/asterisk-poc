[general]
persistentmembers=yes
shared_lastcall=yes
monitor-type=MixMonitor

[q-template](!)
strategy=leastrecent
ringinuse=no
timeout=15
retry=2
wrapuptime=5
autofill=yes
musiconhold=default
joinempty=unavailable,invalid,paused
leavewhenempty=unavailable,invalid
announce-holdtime=no
announce-position=no
periodic-announce-frequency=0
reportholdtime=yes
setinterfacevar=yes
setqueueentryvar=yes
setqueuevar=yes
; sound used when the agent leg is answered; "poc/th-holdon" is played by the dialplan, not here

[q-claim](q-template)
[q-policy](q-template)
[q-general](q-template)
