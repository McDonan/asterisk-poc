; "sim" = second Asterisk used as a test harness + simulated carrier / PSTN:
;   - registers agents 1101-1103 to the PBX (simulated agent phones, ARI controlled)
;   - acts as the carrier: places customer calls to the PBX and receives the outbound calls
;   - hosts the customers' browser phones (WebRTC, numbers 0800000001..N generated at start)
; Calls are controlled through ARI (Stasis app "sim") by tests/e2e.py or the demo UI
[global]
type=global
endpoint_identifier_order=username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[auth-tpl](!)
type=auth
auth_type=userpass

[webrtc-customer](!)
type=endpoint
context=from-customers
webrtc=yes
dtls_auto_generate_cert=yes
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[webrtc-aor](!)
type=aor
max_contacts=1
remove_existing=yes

; customer phone pool (generated by entrypoint.sh when CUSTOMER_POOL is set)
#tryinclude pjsip_customers.conf

[pbx]
type=endpoint
context=from-pbx
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733
; ARI hold on a sim channel => SIP re-INVITE (sendonly) to the PBX, like a real agent phone pressing Hold
moh_passthrough=yes
aors=pbx

[pbx]
type=aor
contact=sip:172.28.0.10:5060

[pbx]
type=identify
endpoint=pbx
match=172.28.0.10

; ---- agent registrations (client side) ----
[auth-1101]
type=auth
auth_type=userpass
username=1101
password=poc-1101

[reg-1101]
type=registration
transport=transport-udp
outbound_auth=auth-1101
server_uri=sip:172.28.0.10
client_uri=sip:1101@172.28.0.10
contact_user=1101
retry_interval=5
expiration=120

[auth-1102]
type=auth
auth_type=userpass
username=1102
password=poc-1102

[reg-1102]
type=registration
transport=transport-udp
outbound_auth=auth-1102
server_uri=sip:172.28.0.10
client_uri=sip:1102@172.28.0.10
contact_user=1102
retry_interval=5
expiration=120

[auth-1103]
type=auth
auth_type=userpass
username=1103
password=poc-1103

[reg-1103]
type=registration
transport=transport-udp
outbound_auth=auth-1103
server_uri=sip:172.28.0.10
client_uri=sip:1103@172.28.0.10
contact_user=1103
retry_interval=5
expiration=120
