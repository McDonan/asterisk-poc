; Voicemail of call center 1484: one mailbox per queue (mailbox name = queue name without "q-").
; Used when a customer calls outside business hours or no agent is available (dialplan context [fallback]).
; Messages are stored as wav + msgNNNN.txt under /var/spool/asterisk/voicemail/default/<mailbox>/INBOX
; and are listed / downloaded through the integration API (GET /voicemail).
[general]
format=wav
maxsecs=120
minsecs=1
maxsilence=8
silencethreshold=128
maxmsg=200
attach=no
skipms=3000
maxlogins=3
review=no
operator=no
saycid=no
sayduration=no

[zonemessages]
bangkok=Asia/Bangkok|'vm-received' Q 'digits/at' IMp

; mailbox => password,name  (lab password 1234; agents listen via *97 or the API)
[default]
accident => 1234,Accident reports
incident => 1234,Other incidents
motor => 1234,Motor insurance
insurance => 1234,Other insurance
sales => 1234,Insurance sales
club => 1234,Friends Club
