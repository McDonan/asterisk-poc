; ============================================================
; PJSIP - SIP / Extension / Trunk   (POC: passwords are for lab use only)
; ============================================================
[global]
type=global
user_agent=POC-PBX
; sim registers agents from the same IP as the "trunk", so match username first, then IP
endpoint_identifier_order=username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------- templates ----------------
[agent-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
device_state_busy_at=1
language=th

; endpoints used by real softphones on the Docker host (RTP is published via port mapping)
[host-media](!)
media_address=${HOST_MEDIA_ADDR}

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ---------------- Agents 1001-1003 : softphone on host ----------------
[1001](agent-endpoint,host-media)
auth=1001
aors=1001
callerid="Agent 1001" <1001>
[1001](auth-tpl)
username=1001
password=poc-1001
[1001](aor-tpl)

[1002](agent-endpoint,host-media)
auth=1002
aors=1002
callerid="Agent 1002" <1002>
[1002](auth-tpl)
username=1002
password=poc-1002
[1002](aor-tpl)

[1003](agent-endpoint,host-media)
auth=1003
aors=1003
callerid="Agent 1003" <1003>
[1003](auth-tpl)
username=1003
password=poc-1003
[1003](aor-tpl)

; ---------------- Simulated agents 1101-1103 : "sim" container (automated E2E) ----------------
[1101](agent-endpoint)
auth=1101
aors=1101
callerid="Sim Agent 1101" <1101>
[1101](auth-tpl)
username=1101
password=poc-1101
[1101](aor-tpl)

[1102](agent-endpoint)
auth=1102
aors=1102
callerid="Sim Agent 1102" <1102>
[1102](auth-tpl)
username=1102
password=poc-1102
[1102](aor-tpl)

[1103](agent-endpoint)
auth=1103
aors=1103
callerid="Sim Agent 1103" <1103>
[1103](auth-tpl)
username=1103
password=poc-1103
[1103](aor-tpl)

; ---------------- Trunk (carrier / PSTN gateway - simulated by "sim", matched by IP) ----------------
[trunk-sim]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733
aors=trunk-sim

; outbound target (carrier / PSTN gateway)
[trunk-sim]
type=aor
contact=sip:172.28.0.20:5060

[trunk-sim]
type=identify
endpoint=trunk-sim
match=172.28.0.20
