[general]
static=yes
writeprotect=no

; Customer browser phones (WebRTC, registered to this carrier) dial the call-center number
[from-customers]
exten => 1484,1,NoOp(customer ${CALLERID(num)} calls 1484)
 same => n,Dial(PJSIP/1484@pbx,120)
 same => n,Hangup(${HANGUPCAUSE})

; calls from the PBX to simulated agents 1101-1103 are handed to the ARI test controller
[from-pbx]
exten => _11XX,1,Stasis(sim,agent,${EXTEN})
 same => n,Hangup()

; Outbound call of the call center to a customer number 08000000NN:
;  - the customer has the web phone open (registered)      -> the browser rings, the customer answers / rejects / ignores
;  - otherwise a simulated customer (demo UI, Stasis app)   -> the demo page rings, same choices
;  - nobody -> unallocated number (hangup cause 1)
exten => _08000000XX,1,Set(CUST_STATE=${DEVICE_STATE(PJSIP/${EXTEN})})
 same => n,NoOp(customer ${EXTEN} state=${CUST_STATE})
 same => n,GotoIf($["${CUST_STATE}"="UNAVAILABLE" | "${CUST_STATE}"="INVALID" | "${CUST_STATE}"="UNKNOWN"]?sim)
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,Hangup(${HANGUPCAUSE})
 same => n(sim),Stasis(sim,customer_out,${EXTEN})
 same => n,Hangup(1)

; Magic numbers (regression tests only, not shown in the UI):
; outcome of an outbound call is chosen by the LAST digit of 09xxxxxxxx
;   1 answer + talk      2 busy        3 no answer (rings)   4 congestion
;   5 unallocated number 6 answer, remote hangs up after 6 s
exten => _09XXXXXXXX,1,Goto(outcome-${EXTEN:-1},s,1)

[outcome-1]
exten => s,1,Answer()
 same => n,Playback(hello-world)
 same => n,Playback(hello-world)
 same => n,Playback(hello-world)
 same => n,Wait(30)
 same => n,Hangup()

[outcome-2]
exten => s,1,Busy(5)

[outcome-3]
exten => s,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()

[outcome-4]
exten => s,1,Congestion(5)

[outcome-5]
exten => s,1,Hangup(1)

[outcome-6]
exten => s,1,Answer()
 same => n,Playback(hello-world)
 same => n,Wait(2)
 same => n,Playback(hello-world)
 same => n,Hangup()
