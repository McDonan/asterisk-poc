[general]
persistentmembers=yes
shared_lastcall=yes
monitor-type=MixMonitor

[q-template](!)
strategy=leastrecent
ringinuse=no
timeout=15
retry=2
wrapuptime=5
autofill=yes
musiconhold=default
joinempty=unavailable,invalid,paused
leavewhenempty=unavailable,invalid
announce-holdtime=no
announce-position=no
periodic-announce-frequency=0
reportholdtime=yes
setinterfacevar=yes
setqueueentryvar=yes
setqueuevar=yes
; sound used when the agent leg is answered; "poc/th-holdon" is played by the dialplan, not here

; one queue per IVR option of call center 1484
[q-accident](q-template)    ; 1 accident report (24h)
[q-incident](q-template)    ; 2 other incident
[q-motor](q-template)       ; 3 motor insurance inquiry
[q-insurance](q-template)   ; 4 other insurance inquiry
[q-sales](q-template)       ; 5 buy insurance
[q-club](q-template)        ; 6 Muang Thai Friends Club
