[general]
enabled=yes
webenabled=no
port=5038
bindaddr=0.0.0.0

; AMI account for the integration API (lab credentials)
[poc-api]
secret=poc-ami-secret
deny=0.0.0.0/0.0.0.0
permit=172.28.0.0/255.255.255.0
read=system,call,agent,user,reporting,cdr,dialplan,dtmf
write=system,call,agent,user,reporting,originate,command
eventfilter=!Event: RTCP*
eventfilter=!Event: VarSet
eventfilter=!Event: Newexten
eventfilter=!Event: ExtensionStatus
eventfilter=!Event: DeviceStateChange
