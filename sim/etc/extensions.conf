[general]
static=yes
writeprotect=no

; calls from the PBX to simulated agents 1101-1103 are handed to the ARI test controller
[from-pbx]
exten => _11XX,1,Stasis(sim,agent,${EXTEN})
 same => n,Hangup()

; Simulated carrier: outcome of an outbound call is chosen by the LAST digit of 09xxxxxxxx
;   1 answer + talk      2 busy        3 no answer (rings)   4 congestion
;   5 unallocated number 6 answer, remote hangs up after 6 s
exten => _09XXXXXXXX,1,Goto(outcome-${EXTEN:-1},s,1)

[outcome-1]
exten => s,1,Answer()
 same => n,Playback(hello-world)
 same => n,Playback(hello-world)
 same => n,Playback(hello-world)
 same => n,Wait(30)
 same => n,Hangup()

[outcome-2]
exten => s,1,Busy(5)

[outcome-3]
exten => s,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()

[outcome-4]
exten => s,1,Congestion(5)

[outcome-5]
exten => s,1,Hangup(1)

[outcome-6]
exten => s,1,Answer()
 same => n,Playback(hello-world)
 same => n,Wait(2)
 same => n,Playback(hello-world)
 same => n,Hangup()
