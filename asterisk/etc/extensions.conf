[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
REC_DIR=/var/spool/asterisk/monitor
; caller-ID presented to the carrier on outbound calls (MTI customer service line)
OUTBOUND_CID=1484
; business hours override: auto = schedule in [sub-hours], open / closed = forced (set at runtime via the API: POST /hours)
HOURS_OVERRIDE=auto

; ============================================================
; Inbound call from carrier / PSTN gateway (DID 1484 = MTI customer service)
; ============================================================
[from-trunk]
exten => _X.,1,NoOp(Inbound ${CALLERID(all)} -> DID ${EXTEN})
 same => n,Set(CDR(direction)=inbound)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(ivr-main,s,1)

; ============================================================
; IVR of call center 1484 (Muang Thai Insurance)
;   1 accident report (24h)   2 other incident   3 motor insurance inquiry
;   4 other insurance inquiry 5 buy insurance    6 Muang Thai Friends Club   9 repeat
; UserEvent(IvrPrompt) is published on AMI so the API / demo UI knows which prompt is playing
; (the demo plays the same wav in the browser when the customer is simulated).
; ============================================================
[ivr-main]
exten => s,1,Set(IVR_TRIES=0)
 same => n,UserEvent(IvrPrompt,Prompt: th-welcome)
 same => n,Playback(poc/th-welcome)
 same => n(menu),Set(IVR_TRIES=$[${IVR_TRIES}+1])
 same => n,GotoIf($[${IVR_TRIES}>3]?bye)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(TIMEOUT(response)=25)
 same => n,UserEvent(IvrPrompt,Prompt: th-menu)
 same => n,Background(poc/th-menu)
 same => n,WaitExten()
 same => n(bye),UserEvent(IvrPrompt,Prompt: th-goodbye)
 same => n,Playback(poc/th-goodbye)
 same => n,Hangup()

exten => 1,1,Set(CDR(ivr_choice)=accident)
 same => n,Goto(queue-flow,q-accident,1)
exten => 2,1,Set(CDR(ivr_choice)=incident)
 same => n,Goto(queue-flow,q-incident,1)
exten => 3,1,Set(CDR(ivr_choice)=motor)
 same => n,Goto(queue-flow,q-motor,1)
exten => 4,1,Set(CDR(ivr_choice)=insurance)
 same => n,Goto(queue-flow,q-insurance,1)
exten => 5,1,Set(CDR(ivr_choice)=sales)
 same => n,Goto(queue-flow,q-sales,1)
exten => 6,1,Set(CDR(ivr_choice)=club)
 same => n,Goto(queue-flow,q-club,1)
exten => 9,1,Goto(s,menu)
exten => i,1,UserEvent(IvrPrompt,Prompt: th-invalid)
 same => n,Playback(poc/th-invalid)
 same => n,Goto(s,menu)
exten => t,1,Goto(s,menu)

; ============================================================
; Queue flow : record, wait with MOH, distribute to agents
; exten name == queue name (also used as transfer target by the API)
; ============================================================
[queue-flow]
exten => _q-.,1,NoOp(Queue ${EXTEN})
 ; FB_BOX = voicemail mailbox / callback topic of this queue (q-motor -> motor)
 same => n,Set(FB_BOX=${EXTEN:2})
 ; q-accident is the 24 h hotline: never closed
 same => n,GotoIf($["${EXTEN}"="q-accident"]?open)
 same => n,Gosub(sub-hours,s,1)
 same => n,GotoIf($["${IS_OPEN}"="1"]?open)
 same => n,Set(FB_REASON=after_hours)
 same => n,Goto(fallback,s,1)
 same => n(open),Gosub(sub-record,s,1(${CALLERID(num)}))
 same => n,UserEvent(IvrPrompt,Prompt: th-holdon)
 same => n,Playback(poc/th-holdon)
 ; t/T = agent/caller may transfer with DTMF, h/H = agent/caller may hang up with DTMF
 ; c = keep the caller in the dialplan when the agent hangs up (so the rating prompt runs)
 same => n,Queue(${EXTEN},tThHc,,,120)
 same => n,NoOp(QUEUESTATUS=${QUEUESTATUS})
 same => n,GotoIf($["${QUEUESTATUS}"="CONTINUE"]?rate)
 ; nobody answered (no agent logged in / all paused / 120 s timeout): offer voicemail or callback
 same => n,Set(FB_REASON=${IF($["${QUEUESTATUS}"="TIMEOUT"]?queue_timeout:no_agent)})
 same => n,Goto(fallback,s,1)
 ; agent hung up (or caller pressed * with option H): ask the customer to rate the agent 1-5, stored in CDR(rating)
 ; invalid key (e.g. 6) or silence: ask again (max 2 tries), then thank the customer anyway
 same => n(rate),Set(RATE_TRIES=0)
 same => n(again),Set(RATE_TRIES=$[${RATE_TRIES}+1])
 same => n,Set(RATING=)
 same => n,UserEvent(IvrPrompt,Prompt: th-rate)
 same => n,Read(RATING,poc/th-rate,1,,1,8)
 same => n,GotoIf($[${REGEX("^[1-5]$" ${RATING})}]?ok)
 same => n,GotoIf($[${RATE_TRIES}>=2]?done)
 same => n,GotoIf($[${LEN(${RATING})}=0]?again)
 same => n,UserEvent(IvrPrompt,Prompt: th-invalid)
 same => n,Playback(poc/th-invalid)
 same => n,Goto(again)
 same => n(ok),Set(CDR(rating)=${RATING})
 same => n,UserEvent(AgentRating,Rating: ${RATING})
 same => n(done),UserEvent(IvrPrompt,Prompt: th-goodbye)
 same => n,Playback(poc/th-goodbye)
 same => n,Hangup()

; Business hours: Mon-Fri 08:30-17:30 (Asia/Bangkok). Sets IS_OPEN=1/0. HOURS_OVERRIDE=open|closed forces the answer.
[sub-hours]
exten => s,1,GotoIf($["${HOURS_OVERRIDE}"="open"]?open)
 same => n,GotoIf($["${HOURS_OVERRIDE}"="closed"]?closed)
 same => n,GotoIfTime(08:30-17:30,mon-fri,*,*,Asia/Bangkok?open:closed)
 same => n(open),Set(IS_OPEN=1)
 same => n,Return()
 same => n(closed),Set(IS_OPEN=0)
 same => n,Return()

; ============================================================
; Fallback: customer reached the call center but nobody can take the call (after hours / no agent / queue timeout)
;   1 leave a voicemail   2 call me back on this number   3 call me back on another number
; callback then asks for a convenient time slot: 1 morning 08:30-12:00, 2 afternoon 12:00-15:00, 3 late 15:00-17:30
; Everything is written to the CDR (fallback, fallback_reason, fallback_queue, callback_number, callback_slot)
; and announced on AMI with UserEvent(Fallback,...) so the transaction timeline shows it.
; Silence / repeated wrong keys end the call politely (no endless loop).
; ============================================================
[fallback]
exten => s,1,Set(CDR(fallback_reason)=${FB_REASON})
 same => n,Set(CDR(fallback_queue)=${FB_BOX})
 same => n,UserEvent(Fallback,Type: offered,Reason: ${FB_REASON},Mailbox: ${FB_BOX})
 same => n,Set(FB_TRIES=0)
 same => n,Set(NUM_TRIES=0)
 same => n,Set(SLOT_TRIES=0)
 same => n,Set(FB_PROMPT=${IF($["${FB_REASON}"="after_hours"]?th-closed:th-noagent)})
 same => n,UserEvent(IvrPrompt,Prompt: ${FB_PROMPT})
 same => n,Playback(poc/${FB_PROMPT})
 same => n(menu),Set(FB_TRIES=$[${FB_TRIES}+1])
 same => n,GotoIf($[${FB_TRIES}>2]?bye)
 same => n,Set(FB_CH=)
 same => n,UserEvent(IvrPrompt,Prompt: th-fallback-menu)
 same => n,Read(FB_CH,poc/th-fallback-menu,1,,1,6)
 same => n,GotoIf($["${FB_CH}"="1"]?vm)
 same => n,GotoIf($["${FB_CH}"="2"]?cb)
 same => n,GotoIf($["${FB_CH}"="3"]?cbnum)
 same => n,GotoIf($[${LEN(${FB_CH})}=0]?menu)
 same => n,UserEvent(IvrPrompt,Prompt: th-invalid)
 same => n,Playback(poc/th-invalid)
 same => n,Goto(menu)
 ; ---- 1: voicemail ----
 same => n(vm),Set(CDR(fallback)=voicemail)
 same => n,UserEvent(Fallback,Type: voicemail,Mailbox: ${FB_BOX})
 same => n,UserEvent(IvrPrompt,Prompt: th-vm-intro)
 same => n,Playback(poc/th-vm-intro)
 same => n,VoiceMail(${FB_BOX}@default,s)
 same => n,UserEvent(IvrPrompt,Prompt: th-goodbye)
 same => n,Playback(poc/th-goodbye)
 same => n,Hangup()
 ; ---- 2: call back the number the customer is calling from (if it looks like a Thai number) ----
 same => n(cb),Set(CB_NUM=${CALLERID(num)})
 same => n,GotoIf($[${LEN(${CB_NUM})}=0]?cbnum)
 same => n,GotoIf($[${REGEX("^0[0-9]{8,9}$" ${CB_NUM})}]?slot:cbnum)
 ; ---- 3: call back another number (9-10 digits, # to finish) ----
 same => n(cbnum),Set(NUM_TRIES=$[${NUM_TRIES}+1])
 same => n,GotoIf($[${NUM_TRIES}>2]?bye)
 same => n,Set(CB_NUM=)
 same => n,UserEvent(IvrPrompt,Prompt: th-callback-number)
 same => n,Read(CB_NUM,poc/th-callback-number,12,,1,10)
 same => n,GotoIf($[${LEN(${CB_NUM})}=0]?cbnum)
 same => n,GotoIf($[${REGEX("^0[0-9]{8,9}$" ${CB_NUM})}]?slot)
 same => n,UserEvent(IvrPrompt,Prompt: th-invalid)
 same => n,Playback(poc/th-invalid)
 same => n,Goto(cbnum)
 ; ---- convenient time slot ----
 same => n(slot),Set(SLOT_TRIES=$[${SLOT_TRIES}+1])
 same => n,GotoIf($[${SLOT_TRIES}>2]?bye)
 same => n,Set(CB_SLOT=)
 same => n,UserEvent(IvrPrompt,Prompt: th-callback-slot)
 same => n,Read(CB_SLOT,poc/th-callback-slot,1,,1,6)
 same => n,GotoIf($[${LEN(${CB_SLOT})}=0]?slot)
 same => n,GotoIf($[${REGEX("^[1-3]$" ${CB_SLOT})}]?save)
 same => n,UserEvent(IvrPrompt,Prompt: th-invalid)
 same => n,Playback(poc/th-invalid)
 same => n,Goto(slot)
 same => n(save),Set(CDR(fallback)=callback)
 same => n,Set(CDR(callback_number)=${CB_NUM})
 same => n,Set(CDR(callback_slot)=${CB_SLOT})
 same => n,UserEvent(Fallback,Type: callback,Number: ${CB_NUM},Slot: ${CB_SLOT},Mailbox: ${FB_BOX})
 same => n,UserEvent(IvrPrompt,Prompt: th-callback-ok)
 same => n,Playback(poc/th-callback-ok)
 same => n,Hangup()
 same => n(bye),UserEvent(IvrPrompt,Prompt: th-goodbye)
 same => n,Playback(poc/th-goodbye)
 same => n,Hangup()

; Start call recording once per call (records only while bridged: option "b")
; ARG1 = remote party used in the file name (caller number inbound, dialed number outbound)
[sub-record]
exten => s,1,GotoIf($["${REC_STARTED}"="1"]?done)
 same => n,Set(__REC_STARTED=1)
 same => n,Set(REC_FILE=${STRFTIME(,,%Y/%m/%d)}/${CHANNEL(linkedid)}-${ARG1}.wav)
 same => n,Set(CDR(recording)=${REC_FILE})
 same => n,MixMonitor(${REC_DIR}/${REC_FILE},b)
 same => n(done),Return()

; ============================================================
; Outbound : agent dials 9 + number (or API click-to-call -> same route)
; Result is stored in CDR: dial_status (ANSWER/BUSY/NOANSWER/CANCEL/CONGESTION/CHANUNAVAIL)
; and hangup_cause. Recording uses option "b" => only calls that were connected get a file.
; ============================================================
[sub-outbound]
exten => s,1,Set(OUT_NUM=${ARG1})
 same => n,Set(AGENT=${IF($[${LEN(${AGENT_EXT})}>0]?${AGENT_EXT}:${CALLERID(num)})})
 same => n,Set(CDR(direction)=outbound)
 same => n,Set(CDR(dialed)=${OUT_NUM})
 same => n,Set(CDR(agent)=${AGENT})
 same => n,Set(CHANNEL(hangup_handler_push)=sub-outbound-hangup,s,1)
 same => n,Gosub(sub-record,s,1(${OUT_NUM}))
 same => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Set(DIAL_T0=${EPOCH})
 same => n,Dial(PJSIP/${OUT_NUM}@trunk-sim,20,tT)
 same => n,Return()

; runs on every hangup of the outbound call (also when the agent cancels while ringing)
[sub-outbound-hangup]
exten => s,1,Set(CDR(dial_status)=${DIALSTATUS})
 same => n,Set(CDR(hangup_cause)=${HANGUPCAUSE})
 ; dial_seconds = ring + talk (measured from just before Dial), answered_seconds = talk.
 ; DIALEDTIME/ANSWEREDTIME are only set by Dial() when the call was answered.
 same => n,Set(CDR(dial_seconds)=${IF($[${LEN(${DIAL_T0})}>0]?$[${EPOCH}-${DIAL_T0}]:0)})
 same => n,Set(CDR(answered_seconds)=${IF($[${LEN(${ANSWEREDTIME})}>0]?${ANSWEREDTIME}:0)})
 same => n,Return()

; ============================================================
; Internal : agents / softphones
; ============================================================
[from-internal]
; --- test extensions ---
exten => 600,1,Answer()
 same => n,Echo()
exten => 601,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; --- dial the IVR from an internal phone ---
exten => 1484,1,Goto(from-trunk,1484,1)

; --- blind transfer (SIP REFER from a browser softphone) into a queue: refer-to sip:q-motor@... ---
exten => _q-.,1,Goto(queue-flow,${EXTEN},1)

; --- outbound: 9 + number (at least 9 digits) ---
exten => _9XXXXXXXX.,1,Gosub(sub-outbound,s,1(${EXTEN:1}))
 same => n,Hangup()
; malformed number: reject locally, nothing is sent to the carrier
exten => _9.,1,Set(CDR(direction)=outbound)
 same => n,Set(CDR(dialed)=${EXTEN:1})
 same => n,Set(CDR(dial_status)=INVALID)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; --- agent to agent (also the target of blind/attended transfer) ---
exten => _1XXX,1,Set(CDR(direction)=internal)
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; --- agent feature codes: login / logout / pause / unpause (all queues) ---
exten => *45,1,Answer()
 same => n,AddQueueMember(q-accident,PJSIP/${CALLERID(num)},,,${CALLERID(name)})
 same => n,AddQueueMember(q-incident,PJSIP/${CALLERID(num)},,,${CALLERID(name)})
 same => n,AddQueueMember(q-motor,PJSIP/${CALLERID(num)},,,${CALLERID(name)})
 same => n,AddQueueMember(q-insurance,PJSIP/${CALLERID(num)},,,${CALLERID(name)})
 same => n,AddQueueMember(q-sales,PJSIP/${CALLERID(num)},,,${CALLERID(name)})
 same => n,AddQueueMember(q-club,PJSIP/${CALLERID(num)},,,${CALLERID(name)})
 same => n,Playback(agent-loginok)
 same => n,Hangup()
exten => *46,1,Answer()
 same => n,RemoveQueueMember(q-accident,PJSIP/${CALLERID(num)})
 same => n,RemoveQueueMember(q-incident,PJSIP/${CALLERID(num)})
 same => n,RemoveQueueMember(q-motor,PJSIP/${CALLERID(num)})
 same => n,RemoveQueueMember(q-insurance,PJSIP/${CALLERID(num)})
 same => n,RemoveQueueMember(q-sales,PJSIP/${CALLERID(num)})
 same => n,RemoveQueueMember(q-club,PJSIP/${CALLERID(num)})
 same => n,Playback(agent-loggedoff)
 same => n,Hangup()
exten => *47,1,Answer()
 same => n,PauseQueueMember(,PJSIP/${CALLERID(num)},,break)
 same => n,Playback(beep)
 same => n,Hangup()
exten => *48,1,Answer()
 same => n,UnpauseQueueMember(,PJSIP/${CALLERID(num)})
 same => n,Playback(beep)
 same => n,Hangup()

; --- listen to customer voicemail (mailbox = accident / incident / motor / insurance / sales / club, password 1234) ---
exten => *97,1,Answer()
 same => n,VoiceMailMain(@default)
 same => n,Hangup()
